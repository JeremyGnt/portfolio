  <style>
    @font-face {
      font-family: 'InterLocal';
      src: url('/fonts/inter-latin-800-normal.woff2') format('woff2');
      font-style: normal;
      font-weight: 800;
      font-display: block;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #000 0%, #111 100%);
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      backdrop-filter: blur(2px);
      overflow: hidden;
    }

    .boot-loader__logo {
      display: flex;
      align-items: flex-end;
      color: rgba(255, 255, 255, 0.95);
      font-family: 'InterLocal', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .boot-loader__dot {
      color: #ebb207;
    }

    .boot-loader__track {
      position: relative;
      width: 140px;
      height: 1px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
    }

    .boot-loader__fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background-color: #ebb207;
      box-shadow: 0 0 8px rgba(235, 178, 7, 0.4);
    }
  </style>
</head>

<body>
  <div id="boot-loader" aria-hidden="true">
    <div class="boot-loader__logo">JG<span class="boot-loader__dot">.</span></div>
    <div class="boot-loader__track">
      <div class="boot-loader__fill"></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>

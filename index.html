  <style>
    :root {
      --intro-surface:
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.045), transparent 18%),
        radial-gradient(circle at 78% 14%, rgba(255, 255, 255, 0.03), transparent 16%),
        radial-gradient(circle at 58% 70%, rgba(255, 255, 255, 0.035), transparent 22%),
        linear-gradient(180deg, #000 0%, #111 100%);
      --intro-grid-opacity: 0.16;
      --intro-grid-size: 140px;
    }

    @font-face {
      font-family: 'InterLocal';
      src: url('/fonts/inter-latin-800-normal.woff2') format('woff2');
      font-style: normal;
      font-weight: 800;
      font-display: block;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #000 0%, #111 100%);
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background: var(--intro-surface);
      overflow: hidden;
    }

    #boot-loader::before,
    #boot-loader::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #boot-loader::before {
      opacity: var(--intro-grid-opacity);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: var(--intro-grid-size) var(--intro-grid-size);
      mask-image: radial-gradient(circle at center, black 34%, transparent 88%);
      -webkit-mask-image: radial-gradient(circle at center, black 34%, transparent 88%);
    }

    #boot-loader::after {
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.24) 100%);
    }

    .boot-loader__logo {
      display: flex;
      align-items: flex-end;
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.95);
      font-family: 'InterLocal', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .boot-loader__dot {
      color: #ebb207;
    }

    .boot-loader__track {
      position: relative;
      z-index: 1;
      width: 140px;
      height: 1px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
    }

    .boot-loader__fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background-color: #ebb207;
      box-shadow: 0 0 8px rgba(235, 178, 7, 0.4);
    }
  </style>
</head>

      <div class="boot-loader__fill"></div>
    </div>
  </div>
  <!--boot-loader:end-->
